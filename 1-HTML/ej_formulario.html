<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
<!--Cree un Formulario con los campos que se proponen a continuacion-->
<!--Agregue el atributo legend-->

<!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
<form name="form suscripcion">
    <p>
Nombre:<input type ="text" name="nombre" placeholder="ingrese su nombre">
</p>
<p>
Apellido:<input type="text" name="apellido" placeholder="ingrese su apellido">
</p>
<p>
Genero:
Masculino:<input type="radio" name= "gender" value="Masculino">
Femenino:<input type="radio" name="gender" value="Femenino">
</p>
<p>
Edad:<input type="number" name="edad" placeholder="edad">
</p>
<p>
Email:<input type="email" name="email" placeholder="usuario@dominio.com">
</p>
<p>
Usuario:<input type="text" name="usuario" placeholder="usuario">
</p>
<p>
Password:<input type="password" name="password" placeholder="contraseña">
</p>
<p>
Confirmar Password:<input type="password" name="segunda password" placeholder="contraseña">
</p>
Tipo de servicio:
<select name="tipo servicio">
    <p> 
    <option value="Free">free></option>
    <option value="Standard">standar</option>
    <option value="Premium">premium</option>
    </p>
</select>
<p>
Tema:
Política <input type="checkbox" value="politica">
Negocios<input type="checkbox" value="negocios">
Tecnología<input type="checkbox" value="tecnologia">
Salud<input type="checkbox" value="salud">
</p>
<p>
Agregue un comentario:
<textarea name="comentario" id>
    agregue un comentario..
</textarea>
</p>
<p>
<button type="button">
    boton enviar
</button>
</p>
</form>
</body>
</html>
