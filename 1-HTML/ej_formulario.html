<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
<!--Cree un Formulario con los campos que se proponen a continuacion-->
<!--Agregue el atributo legend-->

<!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
<form name="form suscripcion">
    <p>
<label for="Nombre">nombre:></label><input type ="text" name="nombre" placeholder="ingrese su nombre" id="nombre">
</p>
<p>
<label for="Apellido">Apellido:</label><input type="text" name="apellido" placeholder="ingrese su apellido" id="Apellido">
</p>
<p>
Genero:
<label for="masculino">Masculino:</label><input type="radio" name= "gender" value="Masculino" id="masculino">
<label for="femenino">Femenino:</label><input type="radio" name="gender" value="Femenino" id="femenino">
</p>
<p>
<label for="edad">Edad:</label><input type="number" name="edad" placeholder="edad" id="edad">
</p>
<p>
<label for="email">Email:</label><input type="email" name="email" placeholder="usuario@dominio.com" id="email">
</p>
<p>
<label for="usuario">Usuario:</label><input type="text" name="usuario" placeholder="usuario" id="usuario">
</p>
<p>
<label for="password">Password:</label><input type="password" name="password" placeholder="contraseña" id="password">
</p>
<p>
<label for="confirmar password">Confirmar Password:</label><input type="password" name="segunda password" placeholder="contraseña" id="confirmar password">
</p>
<label for="tipo de servicio">Tipo de servicio:</label>
<select name="tipo servicio" id="tipo de servicio">
    <p> 
    <option value="Free">free></option>
    <option value="Standard">standar</option>
    <option value="Premium">premium</option>
    </p>
    
</select>
<p>
Tema:
<label for="politica">Política</label> <input type="checkbox" value="politica" id="politica">
<label for="negocios">Negocios<input type="checkbox" value="negocios" id="negocios"></label>
<label for="tecnologia">Tecnología<input type="checkbox" value="tecnologia" id="tecnologia"></label>
<label for="salud">Salud<input type="checkbox" value="salud" id="salud"></label>
</p>
<p>
<label for="comentario">Agregue un comentario:</label>
<textarea name="comentario" id="comentario">
    agregue un comentario..
</textarea>
</p>
<p>
<button type="button">
    boton enviar
</button>
</p>
</form>
</body>
</html>
